version: '3.8'

services:
  # Application QCM complète (frontend + backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qcm-app
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3001:3001"
    volumes:
      # Persistance de la base de données SQLite
      - qcm-data:/usr/share/nginx/api/prisma
      # Persistance des médias uploadés
      - qcm-media:/usr/share/nginx/api/uploads/media
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/usr/share/nginx/api/prisma/dev.db
      - JWT_SECRET=your-production-secret-change-this
      - CORS_ORIGIN=http://localhost:3000
      - MEDIA_UPLOAD_DIR=/usr/share/nginx/api/uploads/media
    networks:
      - qcm-network

  # Option: Backend seul pour développement
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: qcm-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - qcm-data:/usr/share/nginx/api/prisma
      - qcm-media:/usr/share/nginx/api/uploads/media
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=file:/usr/share/nginx/api/prisma/dev.db
      - JWT_SECRET=dev-secret-change-in-production
      - CORS_ORIGIN=http://localhost:3000
      - MEDIA_UPLOAD_DIR=/usr/share/nginx/api/uploads/media
    command: >
      sh -c "
        cd /app/apps/api &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start:dev
      "
    networks:
      - qcm-network
    profiles:
      - dev

volumes:
  qcm-data:
    name: qcm-data
  qcm-media:
    name: qcm-media

networks:
  qcm-network:
    driver: bridge
